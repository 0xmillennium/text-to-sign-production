# Canonical gate admission configuration.
# Tier-quality thresholds live in configs/data/filters.yaml.

source:
  min_character_count: 2
  min_token_count: 1
  fail_on_source_issues: true

frames:
  min_frame_count: 3
  min_valid_frame_count: 1
  min_duration_seconds: 0.125
  max_duration_seconds: null

body:
  min_body_nonzero_frames: 1
  min_body_available_frame_ratio: null

hand:
  min_any_hand_nonzero_frames: 1
  min_any_hand_available_frame_ratio: null
  max_tracked_target_missing_frame_ratio: 0.2

face:
  min_face_nonzero_frames: 1
  min_face_available_frame_ratio: null
