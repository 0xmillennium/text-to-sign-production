    tight:
      max_active_span_abrupt_motion_frame_ratio: 0.20
      max_active_span_discontinuity_frame_ratio: 0.20
      max_active_span_frozen_run_ratio: 0.90

  text:
    loose:
      min_character_count: 2
      min_token_count: 1
    clean:
      min_character_count: 2
      min_token_count: 1
    tight:
      min_character_count: 2
      min_token_count: 1

  length:
    loose:
      min_num_frames: 8
      min_duration_seconds: 0.25
    clean:
      min_num_frames: 8
      min_duration_seconds: 0.25
    tight:
      min_num_frames: 8
      min_duration_seconds: 0.25
