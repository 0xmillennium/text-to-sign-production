families:
  oob:
    loose:
      max_out_of_bounds_ratio: 0.05
    clean:
      max_out_of_bounds_ratio: 0.02
    tight:
      max_out_of_bounds_ratio: 0.01

  upper_body_support:
    loose:
      min_upper_body_support_landmark_coverage_ratio: 0.50
    clean:
      min_upper_body_support_landmark_coverage_ratio: 0.58
    tight:
      min_upper_body_support_landmark_coverage_ratio: 0.62

  hand:
    loose:
      min_active_span_any_hand_available_frame_ratio: 0.50
      max_active_span_any_hand_unavailable_run_ratio: 0.50
    clean:
      min_active_span_any_hand_available_frame_ratio: 0.70
      max_active_span_any_hand_unavailable_run_ratio: 0.30
    tight:
      min_active_span_any_hand_available_frame_ratio: 0.85
      max_active_span_any_hand_unavailable_run_ratio: 0.15

  face:
    loose:
      min_face_available_frame_ratio: 0.50
    clean:
      min_face_available_frame_ratio: 0.50
    tight:
      min_face_available_frame_ratio: 0.50

  confidence:
    loose:
      min_body_available_mean_confidence: 0.20
      min_active_span_any_hand_available_mean_confidence: 0.20
    clean:
      min_body_available_mean_confidence: 0.37
      min_active_span_any_hand_available_mean_confidence: 0.28
    tight:
      min_body_available_mean_confidence: 0.43
      min_active_span_any_hand_available_mean_confidence: 0.38

  temporal_coherence:
